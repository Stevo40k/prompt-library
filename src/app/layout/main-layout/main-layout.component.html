<div class="app-container">
  <aside class="app-sidenav" [class.collapsed]="isCollapsed()">
    <div class="sidenav-header">
      <h2 class="app-title" *ngIf="!isCollapsed()">CreativeKlenk Vault</h2>
      <button mat-icon-button class="toggle-btn" (click)="toggleSidenav()">
        <mat-icon>{{ isCollapsed() ? 'menu' : 'chevron_left' }}</mat-icon>
      </button>
    </div>

    <mat-nav-list class="main-nav">
      <a mat-list-item routerLink="/library" routerLinkActive="active-nav-item">
        <mat-icon matListItemIcon>home_app_logo</mat-icon>
        <span matListItemTitle *ngIf="!isCollapsed()">Home</span>
      </a>
      <a mat-list-item routerLink="/collections" routerLinkActive="active-nav-item">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle *ngIf="!isCollapsed()">Vault</span>
      </a>
      <a mat-list-item>
        <mat-icon matListItemIcon>explore</mat-icon>
        <span matListItemTitle *ngIf="!isCollapsed()">Explore</span>
      </a>
      <a mat-list-item>
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle *ngIf="!isCollapsed()">Profile</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-nav-list>
        <a mat-list-item>
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle *ngIf="!isCollapsed()">Settings</span>
        </a>
        <a mat-list-item>
          <mat-icon matListItemIcon>help_outline</mat-icon>
          <span matListItemTitle *ngIf="!isCollapsed()">Support</span>
        </a>
      </mat-nav-list>
    </div>
  </aside>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
